; PlatformIO Project Configuration File
; SolveX Blackbox ESP32 Telemetry & Crash Response Controller

[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler flags: enable C++17, optimize for speed
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=8192

; Required & optional embedded libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    mikalhart/TinyGPSPlus@^1.0.3
    sandeepmistry/LoRa@^0.8.0
